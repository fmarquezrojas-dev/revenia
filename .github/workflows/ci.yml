name: Revenia verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: facturly_testing
          POSTGRES_USER: facturly_test
          POSTGRES_PASSWORD: facturly_test_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U facturly_test -d facturly_testing"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: facturly_testing
      DB_USERNAME: facturly_test
      DB_PASSWORD: facturly_test_local
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath, intl, mbstring, redis, pcntl, zip
          coverage: none
      - run: echo '127.0.0.1 db' | sudo tee -a /etc/hosts
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit --log-junit ../backend-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: backend-results.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: node scripts/run-integral-e2e.cjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integral-evidence
          path: docs/testing/evidence/

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: revenia-install-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar desde una copia nueva
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend/.env
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          cp backend/.env.example backend/.env
          docker compose build
          docker compose up -d --wait db redis mailpit
          docker compose run --rm --no-deps -e COMPOSER_PROCESS_TIMEOUT=1200 app composer install --no-interaction --prefer-dist
          docker compose run --rm --no-deps app php artisan key:generate
          docker compose run --rm --no-deps frontend npm ci --ignore-scripts
          test "$(docker compose exec -T db psql -U facturly -d facturly -Atqc "select current_database() || '/' || current_user || '/' || (select count(*) from pg_tables where schemaname='public')")" = facturly/facturly/0
          docker compose run --rm --no-deps app php artisan migrate --force
          docker compose up -d
          docker compose exec -T app php artisan migrate:status
          test "$(docker compose exec -T db psql -U facturly -d facturly -Atqc 'select count(*) from migrations')" -eq "$(find backend/database/migrations -name '*.php' | wc -l)"
          docker compose exec -T app php scripts/prepare-demo.php
          python3 scripts/verify-demo-install.py
      - name: Retirar la instalación del runner
        if: always()
        run: docker compose down --volumes
