name: facturly

services:
  app:
    build:
      context: .
      dockerfile: deploy/docker/php.dev.Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: Revenia
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Parallel read panels must not queue behind one development-server process.
      PHP_CLI_SERVER_WORKERS: "4"

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: facturly
      DB_USERNAME: facturly
      DB_PASSWORD: facturly_local

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: database

      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: demo@facturly.test
      MAIL_FROM_NAME: Revenia
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
      - --no-reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
      - --strictPort

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: facturly
      POSTGRES_USER: facturly
      POSTGRES_PASSWORD: facturly_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturly -d facturly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data:
